
services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: learn-ws-server
    expose:
      - "8081"
    # ports:
    #   - "8081:8081"
    env_file:
      - ./server/.env.production
    restart: always

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: learn-ws-web
    expose:
      - "3000" 
    # ports:
    #   - "3000:3000"
    env_file:
      - ./web/.env.production
    restart: always
    depends_on:
      - server

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - server
    restart: always
